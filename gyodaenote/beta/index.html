<h1>교대노트 1.3 테스트</h1>
<p class="lede">등록된 테스트 아이폰에서만 설치됩니다.</p>
<p><a href="itms-services://?action=download-manifest&amp;url=https://heysep.github.io/gyodaenote/beta/manifest.plist"><strong>아이폰에 설치하기</strong></a></p>
<ol>
<li>이 페이지를 아이폰 <strong>Safari</strong>로 열고 위 링크를 누릅니다.</li>
<li>「설치」를 누르면 홈 화면에 교대노트가 생깁니다. 앱스토어판이 이미 있으면 그 위에 덮어씌워지고 근무표는 그대로 남습니다.</li>
<li>처음 열 때 막히면 설정 → 개인정보 보호 및 보안 → <strong>개발자 모드</strong>를 켜고 재시동합니다.</li>
</ol>
