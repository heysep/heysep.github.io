<h1>VIX 알림</h1><p>「VIX 가 30 을 넘으면」 같은 조건을 넣어 두면 서버가 15초마다 지수를 지켜보다가 넘는 순간 iPhone 으로 푸시를 보내는 iOS 앱. 알림에 지수 시각이 같이 적혀 오고, 계정은 없습니다. 「신호 이력」은 과거에 VIX 가 그 선을 넘은 날 TQQQ·SOXL 을 샀다면 그 뒤 어땠는지를 실제 종가로 잰 기록입니다 — 미래 수익을 말하지 않습니다.</p>
